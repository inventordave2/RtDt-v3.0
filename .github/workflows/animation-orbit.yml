name: Render AetherOre Orbit — 192 frames

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/animation-orbit.yml'

jobs:
  orbit-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run animation and scene parity checks
        run: |
          node tests/aetherore-formula.test.js
          node tests/scene-cli-parity.test.js
      - name: Render all 192 frames at 24 FPS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renders/orbit
          for ((frame=0; frame<192; frame++)); do
            printf -v number '%04d' "$frame"
            node cli.js \
              --scene-file samples/orbit.scene \
              --phy samples/orbit/orbit-formula.phy \
              --frame "$frame" \
              --width 160 --height 90 \
              --output "renders/orbit/frame-${number}.png" > /tmp/rtdt-frame.log 2>&1 || {
                cat /tmp/rtdt-frame.log
                exit 1
              }
            if (( frame % 24 == 0 )); then echo "Rendered frame $frame / 191"; fi
          done
      - name: Validate the complete PNG sequence
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const dir = 'renders/orbit';
          const filenames = fs.readdirSync(dir).filter(name => /^frame-\d{4}\.png$/.test(name)).sort();
          if (filenames.length !== 192) throw Error('Expected 192 frames, found ' + filenames.length);
          const signatures = new Set();
          const manifest = [];
          for (let frame=0;frame<192;frame++) {
            const name = 'frame-' + String(frame).padStart(4,'0') + '.png';
            if (filenames[frame] !== name) throw Error('Missing sequence frame: ' + name);
            const bytes = fs.readFileSync(path.join(dir,name));
            if (bytes.subarray(0,8).toString('hex') !== '89504e470d0a1a0a') throw Error('Invalid PNG: ' + name);
            if (bytes.readUInt32BE(16) !== 160 || bytes.readUInt32BE(20) !== 90)
              throw Error('Invalid frame dimensions: ' + name);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            signatures.add(sha256);
            manifest.push({name,frame,timeSeconds:frame/24,sha256,bytes:bytes.length});
          }
          if (signatures.size < 2) throw Error('Animation frames did not change');
          fs.writeFileSync(path.join(dir,'manifest.json'),JSON.stringify({fps:24,
            frameCount:192,width:160,height:90,distinctFrames:signatures.size,frames:manifest},null,2));
          console.log('Validated 192 PNG images, ' + signatures.size + ' distinct frame hashes');
          NODE
      - name: Create MP4 preview
        run: ffmpeg -y -framerate 24 -i renders/orbit/frame-%04d.png -c:v libx264 -pix_fmt yuv420p renders/orbit-animation.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtdt-orbit-192-frames
          path: |
            renders/orbit/
            renders/orbit-animation.mp4
          if-no-files-found: warn
          retention-days: 14
